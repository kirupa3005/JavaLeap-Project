# ==================================================
# SHIFTPLANNER Application Properties
# ==================================================

# Server Configuration
server.port=8080

# --------------------------------------------------
# OPTION A: In-Memory H2 Database (Running out-of-the-box)
# Works immediately without needing MySQL server or password
# --------------------------------------------------
spring.datasource.url=jdbc:h2:mem:shiftplanner;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=3005
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

